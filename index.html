<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Audio Deck 8</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background-color: #08090C;
      color: #F1F5F9;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 32px 14px 24px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      user-select: none;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .sub-title {
      font-size: 11px;
      letter-spacing: 3px;
      font-family: monospace;
      color: #64748B;
      font-weight: bold;
    }
    .main-title { font-size: 22px; font-weight: 600; }
    .badge {
      background: #11141C;
      border: 1px solid #1E2433;
      border-radius: 8px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-family: monospace;
      font-weight: bold;
      color: #64748B;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #475569;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      flex-grow: 1;
    }
    .card {
      background: linear-gradient(180deg, #10141D 0%, #0C0E14 100%);
      border: 1px solid #1E2330;
      border-radius: 16px;
      padding: 14px 12px;
      min-height: 135px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.2s;
    }
    .card:active { transform: scale(0.98); }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .track-num {
      font-size: 11px;
      font-family: monospace;
      font-weight: bold;
      color: #475569;
    }
    .bars {
      display: flex;
      gap: 2.5px;
      align-items: flex-end;
      height: 14px;
    }
    .bar {
      width: 3px;
      background: #334155;
      border-radius: 1px;
    }
    .track-name {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.2;
      margin-top: 6px;
    }
    .track-status {
      font-size: 9px;
      font-family: monospace;
      letter-spacing: 1px;
      color: #64748B;
      margin-top: 2px;
    }
    .volume-box {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .volume-label {
      font-size: 9px;
      font-family: monospace;
      color: #64748B;
      width: 24px;
    }
    .volume-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 2.5px;
      background: #1E2433;
      outline: none;
    }
    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #38BDF8;
      cursor: pointer;
    }
    .card.playing {
      border-color: #38BDF8;
      background: linear-gradient(180deg, #161C26 0%, #0F131A 100%);
    }
    .card.playing .track-num, .card.playing .track-status { color: #38BDF8; }
    .card.playing .bar { background: #38BDF8; }
    .card.paused { border-color: #F59E0B; }
    .card.paused .track-num, .card.paused .track-status { color: #F59E0B; }
    .card.paused .bar { background: #F59E0B; }
    .reset-btn {
      margin-top: 16px;
      height: 46px;
      border-radius: 12px;
      background: #0F121A;
      border: 1px solid #1F2636;
      color: rgba(239, 68, 68, 0.85);
      font-family: monospace;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .reset-btn:active { background: #1a151b; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="sub-title">DECK CONTROL (8-CH)</div>
      <div class="main-title">Audio Deck</div>
    </div>
    <div class="badge" id="deckStatus">
      <div class="badge-dot" id="deckDot"></div>
      <span id="deckText">IDLE</span>
    </div>
  </div>

  <div class="grid" id="soundGrid"></div>

  <div class="reset-btn" onclick="allReset()">ALL RESET</div>

  <script>
        const sounds = [
      { id: "01", name: "居酒屋", src: "居酒屋.mp3", defaultVol: 1.0 },
      { id: "02", name: "星めぐり蝉", src: "星めぐり蝉.mp3", defaultVol: 1.0 },
      { id: "03", name: "校歌", src: "校歌.mp3", defaultVol: 1.0 },
      { id: "04", name: "着信音", src: "着信音.mp3", defaultVol: 1.0 },
      { id: "05", name: "汽車", src: "汽車.mp3", defaultVol: 1.0 },
      { id: "06", name: "鶴6", src: "鶴.mp3", defaultVol: 1.0 },
      { id: "07", name: "星めぐりジョバンニ7", src: "星めぐりの歌9ジョバンニ.mp3", defaultVol: 1.0 },
      { id: "08", name: "スピカ8", src: "スピカ.mp3", defaultVol: 1.0 },
      { id: "09", name: "ヒグラシ", src: "ヒグラシ.mp3", defaultVol: 1.0 }
    ];


    const FADE_DURATION = 1000;
    const audioPlayers = new Array(sounds.length).fill(null);
    const volumes = sounds.map(s => s.defaultVol);
    const fadeTimers = new Array(sounds.length).fill(null);
    const grid = document.getElementById('soundGrid');

    sounds.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.id = `card-${index}`;

      card.onclick = (e) => {
        if (e.target.classList.contains('volume-slider')) return;
        toggleSound(index);
      };

      card.innerHTML = `
        <div>
          <div class="card-top">
            <div class="track-num">${item.id}</div>
            <div class="bars">
              <div class="bar" style="height: 3px;"></div>
              <div class="bar" style="height: 3px;"></div>
              <div class="bar" style="height: 3px;"></div>
            </div>
          </div>
          <div class="track-name">${item.name}</div>
          <div class="track-status" id="status-${index}">STANDBY</div>
        </div>

        <div class="volume-box">
          <span class="volume-label" id="vol-val-${index}">${Math.round(item.defaultVol * 100)}%</span>
          <input type="range" class="volume-slider" min="0" max="1" step="0.05" value="${item.defaultVol}"
            oninput="changeVolume(${index}, this.value, event)"
            onclick="event.stopPropagation()">
        </div>
      `;
      grid.appendChild(card);
    });

    function changeVolume(idx, val, event) {
      volumes[idx] = parseFloat(val);
      document.getElementById(`vol-val-${idx}`).innerText = `${Math.round(val * 100)}%`;
      if (audioPlayers[idx] && !fadeTimers[idx]) {
        audioPlayers[idx].volume = volumes[idx];
      }
    }

    function fadeAudio(idx, startVol, targetVol, duration, onComplete) {
      if (fadeTimers[idx]) clearInterval(fadeTimers[idx]);
      const audio = audioPlayers[idx];
      if (!audio) return;

      const steps = 30;
      const stepInterval = duration / steps;
      const volumeDelta = (targetVol - startVol) / steps;
      let currentStep = 0;

      audio.volume = Math.min(Math.max(startVol, 0), 1);

      fadeTimers[idx] = setInterval(() => {
        currentStep++;
        const nextVol = startVol + (volumeDelta * currentStep);
        audio.volume = Math.min(Math.max(nextVol, 0), 1);

        if (currentStep >= steps) {
          clearInterval(fadeTimers[idx]);
          fadeTimers[idx] = null;
          audio.volume = Math.min(Math.max(targetVol, 0), 1);
          if (onComplete) onComplete();
        }
      }, stepInterval);
    }

    function checkOverallStatus() {
      const hasPlaying = audioPlayers.some(a => a && !a.paused);
      const dot = document.getElementById('deckDot');
      const text = document.getElementById('deckText');

      if (hasPlaying) {
        dot.style.background = '#10B981';
        text.style.color = '#10B981';
        text.innerText = 'LIVE';
      } else {
        dot.style.background = '#475569';
        text.style.color = '#64748B';
        text.innerText = 'IDLE';
      }
    }

    function toggleSound(idx) {
      const card = document.getElementById(`card-${idx}`);
      const status = document.getElementById(`status-${idx}`);

      if (audioPlayers[idx]) {
        if (!audioPlayers[idx].paused) {
          status.innerText = 'FADING OUT';

          fadeAudio(idx, audioPlayers[idx].volume, 0, FADE_DURATION, () => {
            if (audioPlayers[idx]) audioPlayers[idx].pause();
            card.className = 'card paused';
            status.innerText = 'PAUSED';
            setBarHeight(card, 3, 3, 3);
            checkOverallStatus();
          });
        } else {
          audioPlayers[idx].play();
          card.className = 'card playing';
          status.innerText = 'FADING IN';
          setBarHeight(card, 8, 14, 6);

          fadeAudio(idx, 0, volumes[idx], FADE_DURATION, () => {
            if (status.innerText === 'FADING IN') status.innerText = 'PLAYING';
          });

          checkOverallStatus();
        }
        return;
      }

      const audio = new Audio(sounds[idx].src);
      audio.volume = 0;
      audioPlayers[idx] = audio;

      audio.play();

      card.className = 'card playing';
      status.innerText = 'FADING IN';
      setBarHeight(card, 8, 14, 6);
      checkOverallStatus();

      fadeAudio(idx, 0, volumes[idx], FADE_DURATION, () => {
        if (status.innerText === 'FADING IN') status.innerText = 'PLAYING';
      });

      audio.onended = () => {
        resetCard(idx);
        checkOverallStatus();
      };
    }

    function resetCard(idx) {
      if (fadeTimers[idx]) {
        clearInterval(fadeTimers[idx]);
        fadeTimers[idx] = null;
      }

      if (audioPlayers[idx]) {
        audioPlayers[idx].pause();
        audioPlayers[idx].currentTime = 0;
        audioPlayers[idx] = null;
      }

      const c = document.getElementById(`card-${idx}`);
      const s = document.getElementById(`status-${idx}`);

      c.className = 'card';
      s.innerText = 'STANDBY';
      setBarHeight(c, 3, 3, 3);
    }

    function setBarHeight(card, h1, h2, h3) {
      const bars = card.querySelectorAll('.bar');
      bars[0].style.height = `${h1}px`;
      bars[1].style.height = `${h2}px`;
      bars[2].style.height = `${h3}px`;
    }

    function allReset() {
      sounds.forEach((_, idx) => {
        if (audioPlayers[idx] && !audioPlayers[idx].paused) {
          const s = document.getElementById(`status-${idx}`);
          s.innerText = 'FADING OUT';

          fadeAudio(idx, audioPlayers[idx].volume, 0, FADE_DURATION, () => {
            resetCard(idx);
            checkOverallStatus();
          });
        } else {
          resetCard(idx);
        }
      });

      checkOverallStatus();
    }
  </script>
</body>
</html>
